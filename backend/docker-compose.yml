version: '3.9'

services:
  db:
    image: postgres:15
    container_name: medibook-db
    restart: always
    environment:
      POSTGRES_DB: mediconnect
      POSTGRES_USER: internship_user
      POSTGRES_PASSWORD: internship_pass
    ports:
      - "5433:5432"
    volumes:
      - mediconnect_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: medibook-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  mediconnect_data:
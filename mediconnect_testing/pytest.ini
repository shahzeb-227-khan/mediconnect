[pytest]
markers =
    functional: E2E feature tests with real UI interactions
    navigation: Link and routing tests across pages
    api: Backend API endpoint tests (CRUD operations)
    network: Network request mocking and interception tests
    crossbrowser: Cross-browser compatibility tests
    bug: Intentional bug demonstration (expected failure when bug is active)

addopts =
    --html=test_report.html
    --self-contained-html
    --screenshot only-on-failure

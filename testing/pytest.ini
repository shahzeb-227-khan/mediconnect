[pytest]
markers =
    smoke: Quick sanity checks that core pages load (deselect with '-m "not smoke"')
    functional: Feature behaviour tests with real UI interactions
    navigation: Link and routing tests across pages
    form_validation: Input validation and constraint tests
    responsive: Viewport / mobile-responsive layout tests
    performance: Page load time and network performance tests
    api: Backend API endpoint tests (CRUD operations)
    network: Network request mocking and interception tests
    accessibility: Accessibility scans and ARIA locator tests
    crossbrowser: Cross-browser compatibility tests
    bug: Intentional bug demonstrations (expected failures)

addopts =
    --html=test_report.html
    --self-contained-html
    --screenshot only-on-failure
